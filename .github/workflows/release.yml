name: Release

# Publishing is driven by a tag, so the released code is exactly what was
# tagged. Nothing publishes from a branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: it signs the package with an OIDC token
      # from this run, so consumers can verify it was built from this repo at
      # this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Never publish something that does not pass. A tag is not a promise
      # that the tests were run before it was cut.
      - name: Test
        run: npm test

      - name: The tag and package.json agree
        run: |
          set -e
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          [ "$tag" = "$pkg" ] || {
            echo "Refusing to publish: the tag and package.json version disagree."
            exit 1
          }

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
